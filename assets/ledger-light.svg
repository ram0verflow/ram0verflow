ext x="551" y="96" fill="#1c5b52" font-size="10.5">@ywltby</text><text x="551" y="110" fill="#68746e" font-size="9">原神？启动！</text><line x1="688" y1="82.0" x2="714" y2="82.0" stroke="#b3bcb4" stroke-width="1.5" stroke-dasharray="3 3"/><rect x="714" y="44" width="148" height="76" rx="4" fill="#ffffff" stroke="#d5dbd2" stroke-width="1"/><text x="725" y="65" fill="#8a5f10" font-size="13" font-weight="700">#1992</text><text x="725" y="81" fill="#121916" font-size="10">b1839293899fbf0f&#8230;</text><text x="725" y="96" fill="#1c5b52" font-size="10.5">@ywltby</text><text x="725" y="110" fill="#68746e" font-size="9">面善打个D啊，喜欢我的战斗脸吗？</text><line x1="862" y1="82.0" x2="888" y2="82.0" stroke="#b3bcb4" stroke-width="1.5" stroke-dasharray="3 3"/><rect x="888" y="44" width="148" height="76" rx="4" fill="#ffffff" stroke="#d5dbd2" stroke-width="1"/><text x="899" y="65" fill="#8a5f10" font-size="13" font-weight="700">#1993</text><text x="899" y="81" fill="#121916" font-size="10">b368b965bb98feee&#8230;</text><text x="899" y="96" fill="#1c5b52" font-size="10.5">@ywltby</text><text x="899" y="110" fill="#68746e" font-size="9">天不生我ZmjjKK，瓦圈万古如长夜。</text></svg>
